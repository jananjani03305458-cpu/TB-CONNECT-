<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T&B Connect</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
body{margin:0;background:#100d20;color:white;font-family:Arial,sans-serif;padding:20px}
.box{max-width:430px;margin:35px auto;background:#211b38;padding:25px;border-radius:18px}
h1{color:#39e6dc;text-align:center}
h2{text-align:center}
input,select,textarea,button{box-sizing:border-box;width:100%;padding:13px;margin:9px 0;border:0;border-radius:9px;font-size:16px}
button{background:#39e6dc;color:#111;font-weight:bold;cursor:pointer}
.small{color:#bbb;text-align:center;font-size:13px}
#app{display:none}
#message{color:#39e6dc;text-align:center}
</style>
</head>
<body>
<div class="box">
<h1>T&B Connect</h1>
<p class="small">Connect • Discover • Make Friends</p>

<div id="login">
<h2>Welcome</h2>
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password">
<button onclick="signup()">Create Account</button>
<button onclick="loginUser()">Login</button>
<p id="message"></p>
</div>

<div id="app">
<h2>Create Your Profile</h2>
<p class="small">Complete your profile to continue.</p>
<input id="name" placeholder="Your full name">
<input id="age" type="number" placeholder="Your age (18+)">
<select id="gender">
<option value="">Select gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
<input id="city" placeholder="Your city">
<input id="photo" type="url" placeholder="Profile picture URL (optional)">
<textarea id="about" rows="4" placeholder="Write something about yourself"></textarea>
<button onclick="saveProfile()">Save Profile</button>
<p id="profileMessage"></p>
<button onclick="logout()" style="background:#aaa">Logout</button>
</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDgRHZIDxKXOtP0Qm4lChk4EnLmo7yidBE",
  authDomain: "tb-connect-38e83.firebaseapp.com",
  projectId: "tb-connect-38e83",
  storageBucket: "tb-connect-38e83.firebasestorage.app",
  messagingSenderId: "917954139441",
  appId: "1:917954139441:web:a2c7a7d4b1c2fa0c7e0c10"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function showMessage(id, text) {
  document.getElementById(id).textContent = text;
}

function signup() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  auth.createUserWithEmailAndPassword(email, password)
    .then(() => showMessage("message", "Account created!"))
    .catch(e => showMessage("message", e.message));
}

function loginUser() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, password)
    .catch(e => showMessage("message", e.message));
}

auth.onAuthStateChanged(async user => {
  document.getElementById("login").style.display = user ? "none" : "block";
  document.getElementById("app").style.display = user ? "block" : "none";

  if (user) {
    try {
      const doc = await db.collection("users").doc(user.uid).get();
      if (doc.exists) {
        const p = doc.data();
        document.getElementById("name").value = p.name || "";
        document.getElementById("age").value = p.age || "";
        document.getElementById("gender").value = p.gender || "";
        document.getElementById("city").value = p.city || "";
        document.getElementById("photo").value = p.photo || "";
        document.getElementById("about").value = p.about || "";
        showMessage("profileMessage", "Your profile is loaded.");
      }
    } catch (e) {
      showMessage("profileMessage", e.message);
    }
  }
});

async function saveProfile() {
  const user = auth.currentUser;
  if (!user) return;

  const name = document.getElementById("name").value.trim();
  const age = Number(document.getElementById("age").value);
  const gender = document.getElementById("gender").value;
  const city = document.getElementById("city").value.trim();
  const photo = document.getElementById("photo").value.trim();
  const about = document.getElementById("about").value.trim();

  if (!name || !Number.isInteger(age) || age < 18 || age > 120 || !gender || !city) {
    showMessage("profileMessage", "Enter your name, valid age (18+), gender and city.");
    return;
  }

  try {
    await db.collection("users").doc(user.uid).set({
      name, age, gender, city, photo, about,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true});

    showMessage("profileMessage", "Profile saved successfully!");
  } catch (e) {
    showMessage("profileMessage", "Error: " + e.message);
  }
}

function logout() {
  auth.signOut();
}
</script>
</body>
</html>
